<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Application Letter — Engr. Tradio — Surveyor Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,800;1,600;1,800&family=Oswald:wght@500;600;700&family=Playfair+Display:ital,wght@1,500;1,600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="navbar" aria-label="Main navigation">
    <a class="navbar__logo" href="index.html" aria-label="Home">
      <img class="navbar__logo-mark" src="assets/icon.jpeg" alt="Engr. Tradio logo" />
    </a>
    <ul class="navbar__links" id="nav-links">
      <li><a href="index.html">HOME</a></li>
      <li><a class="is-active" href="application-letter.html">Application Letter</a></li>
      <li><a href="#">Certificates &amp; Achievements</a></li>
      <li><a href="#">Trainings &amp; Seminars</a></li>
      <li><a href="#">Work Experience</a></li>
    </ul>
    <button
      class="navbar__toggle"
      id="nav-toggle"
      aria-label="Toggle menu"
      aria-expanded="false"
      aria-controls="nav-links"
    >
      <span></span><span></span><span></span>
    </button>
  </nav>

  <main class="letter">
    <img
      class="letter__bg"
      src="assets/applicationletter_bg.png"
      alt="Application Letter — survey-themed plate with compass rose, contour map, and total station"
    />
    <button
      class="letter__thumb"
      type="button"
      aria-haspopup="dialog"
      aria-controls="letter-viewer"
      aria-label="Open the application letter in a full-screen viewer"
    >
      <img
        class="letter__thumb-img"
        src="assets/application_letter.jpg"
        alt="Application letter to Ma. Theresa J. Allen, Regional Executive Director, DENR Regional Office XIII, expressing interest in the Engineer I (Geodetic Surveys Division) position — by Joanna Marie S. Tradio, Licensed Geodetic Engineer."
      />
    </button>
  </main>

  <dialog class="letter__viewer" id="letter-viewer" aria-label="Application letter, enlarged">
    <button class="letter__viewer-close" type="button" aria-label="Close viewer">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path d="M5 5 L19 19 M19 5 L5 19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none" />
      </svg>
    </button>
    <div class="letter__viewer-stage">
      <img
        class="letter__viewer-img"
        src="assets/application_letter.jpg"
        alt="Application letter to Ma. Theresa J. Allen, Regional Executive Director, DENR Regional Office XIII, expressing interest in the Engineer I (Geodetic Surveys Division) position — by Joanna Marie S. Tradio, Licensed Geodetic Engineer."
        loading="lazy"
        decoding="async"
      />
    </div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
