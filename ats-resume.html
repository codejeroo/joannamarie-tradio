<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATS-Optimized Resume — Engr. Tradio — Surveyor Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,800;1,600;1,800&family=Oswald:wght@500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="navbar" aria-label="Main navigation">
    <a class="navbar__logo" href="index.html" aria-label="Home">
      <img class="navbar__logo-mark" src="assets/icon.jpeg" alt="Engr. Tradio logo" />
    </a>
    <ul class="navbar__links" id="nav-links">
      <li><a href="index.html">HOME</a></li>
      <li><a href="application-letter.html">Application Letter</a></li>
      <li><a class="is-active" href="resume.html">Resume</a></li>
      <li><a href="certificates.html">Certificates &amp; Achievements</a></li>
      <li><a href="#">Work Experience</a></li>
      <li><a href="contact.html">Contact Me</a></li>
    </ul>
    <button
      class="navbar__toggle"
      id="nav-toggle"
      aria-label="Toggle menu"
      aria-expanded="false"
      aria-controls="nav-links"
    >
      <span></span><span></span><span></span>
    </button>
  </nav>

  <main class="letter">
    <img
      class="letter__bg"
      src="assets/ats-optimized_bg.png"
      alt="ATS-Optimized Resume — survey-themed plate with compass rose, contour lines, and total station"
    />
    <button
      class="letter__thumb"
      type="button"
      aria-haspopup="dialog"
      aria-controls="viewer"
      aria-label="Open the ATS-optimized resume in a full-screen viewer"
      data-viewer-src="assets/ats_resume.jpg"
      data-viewer-alt="ATS-optimized resume of Joanna Marie S. Tradio, Licensed Geodetic Engineer — a plain single-column layout with professional objective, education, professional experience and projects, certifications and trainings, technical skills, and character references."
      data-viewer-label="ATS-optimized resume, enlarged"
    >
      <img
        class="letter__thumb-img"
        src="assets/ats_resume.jpg"
        alt="ATS-optimized resume of Joanna Marie S. Tradio, Licensed Geodetic Engineer — a plain single-column layout with professional objective, education, professional experience and projects, certifications and trainings, technical skills, and character references."
      />
    </button>
  </main>

  <dialog class="viewer" id="viewer">
    <button class="viewer__close" type="button" aria-label="Close viewer">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path d="M5 5 L19 19 M19 5 L5 19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none" />
      </svg>
    </button>
    <div class="viewer__stage">
      <img class="viewer__img" alt="" />
    </div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
